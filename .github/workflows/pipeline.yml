name: 1 - The startuphafen pipeline
run-name: 'Pipeline triggered by ${{ github.actor }} with commit "${{ github.event.head_commit.message }}"'
on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Init node, later steps will always need it
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
        # cache node_modules and friends
      - uses: actions/checkout@v4
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: cache-node-modules-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: deploy3 tests # test deploy3, should be fast
        run: cd tools/deploy3 && npm install && npm test && cd ../../
      - name: check for @only tag in feature files
        run: node ./tools/pipeline/search-at-only-in-feature-files.js

      # run nx affected and create artifact with affected packages/apps
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          # Default branch of this repository
          main-branch-name: 'main'
          workflow-id: 'pipeline.yml'
      - name: Create commit stage jobs
        run: node ./tools/pipeline/create-commit-jobs.js ${{ env.NX_BASE }} ${{ env.NX_HEAD }}
      - name: Create artifact with affected
        uses: actions/upload-artifact@v4
        with:
          name: affected-projects
          path: affected.json
      - id: set-matrix
        run: echo "matrix=$(cat job-matrix.json)" >> $GITHUB_OUTPUT

  commit-checks:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.matrix != '{}' }}
    strategy:
      matrix: ${{fromJson(needs.prepare.outputs.matrix)}}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: cache-node-modules-${{ hashFiles('package-lock.json') }}
      - name: run commit checks
        # Some parts of the code may need a framebuffer -> use xvfb-run
        run: xvfb-run node ./tools/pipeline/run-commit-job.js ${{ matrix.check }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: sudo timedatectl set-timezone Europe/Berlin

      - uses: actions/checkout@v4

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: cache-node-modules-${{ hashFiles('package-lock.json') }}

      # Clean any previous build
      - run: rm -rf dist

      # First call for the purpose of the build
      - run: node ./tools/pipeline/version.js startuphafen
      - run: npm run build

      # Second call for the purpose of the version.json file
      - run: node ./tools/pipeline/version.js startuphafen

      - name: Remove frontend sourcemaps from release artifact
        run: |
          find dist/apps/startuphafen-frontend -type f -name '*.map' -delete

      # -y to keep symlinks
      - run: zip -y -q -r startuphafen-rc.zip dist

      - name: Create artifact with release-candidate zip
        uses: actions/upload-artifact@v4
        with:
          name: startuphafen-rc
          path: startuphafen-rc.zip
          # these release-candidates are primarily meant to be used further down the pipeline
          # no need to keep them for longer than 1 day
          retention-days: 1

  accept-and-release:
    needs:
      - build
      - commit-checks
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ env.TAG_NAME }}
    steps:
      ###
      ###
      ### Init
      ###
      ###
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/checkout@v4

      - name: Download the release candidate
        uses: actions/download-artifact@v4
        with:
          name: startuphafen-rc

      - run: unzip -q startuphafen-rc.zip

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/Cypress
          key: cache-node-modules-${{ hashFiles('package-lock.json') }}

      ###
      ###
      ### Create release
      ###
      ###

      - name: Check if release should be created
        id: should_release
        run: |
          # Determine whether a release should be created for this ref
          # Allowed refs:
          #  - dev
          #  - main
          #  - any feature/* branch
          #  - any fix/* branch
          #  - any poc/* branch
          if [[ "${{ github.ref }}" == "refs/heads/dev" \
              || "${{ github.ref }}" == "refs/heads/main" \
              || "${{ github.ref }}" =~ ^refs/heads/feature/ \
              || "${{ github.ref }}" =~ ^refs/heads/fix/ \
              || "${{ github.ref }}" =~ ^refs/heads/poc/ ]]; then
            echo "should_create=true" >> $GITHUB_OUTPUT
          else
            echo "should_create=false" >> $GITHUB_OUTPUT
          fi

      - name: Get tag name
        run: echo "TAG_NAME=$(node ./tools/pipeline/output-versions.js startuphafen)" >> $GITHUB_ENV

      - name: Export tag name
        run: echo "TAG_NAME=${{ env.TAG_NAME }}" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.should_release.outputs.should_create == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/' + process.env.TAG_NAME,
              sha: context.sha
            })

      - name: Create Release
        if: steps.should_release.outputs.should_create == 'true'
        id: create_release
        uses: shogo82148/actions-create-release@v1
        with:
          tag_name: refs/tags/${{ env.TAG_NAME }}
          release_name: ${{ env.TAG_NAME }}

      - name: Resolve PR from release tag
        if: steps.should_release.outputs.should_create == 'true'
        id: resolve-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_ENVS }}
        run: |
          PR_NUMBER=$(node tools/deploy3/bin/resolve-pr.cjs --tag "${{ env.TAG_NAME }}" --repo "$GITHUB_REPOSITORY")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER for release ${{ env.TAG_NAME }}"
          else
            echo "No PR found for release ${{ env.TAG_NAME }}"
          fi

      - name: Post release comment to PR
        if: steps.should_release.outputs.should_create == 'true' && steps.resolve-pr.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_ENVS }}
        run: |
          node tools/deploy3/bin/post-pr-comment.cjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ steps.resolve-pr.outputs.pr_number }}" \
            --type release-created \
            --release "${{ env.TAG_NAME }}"

      - run: mv dist/ ${{ env.TAG_NAME }}

      - run: zip -q -r ${{ env.TAG_NAME }}.zip ${{ env.TAG_NAME }}

      - uses: shogo82148/actions-upload-release-asset@62365f23c0419a04b7161371be3fe0be0893ab10 #1.8.2
        if: steps.should_release.outputs.should_create == 'true'
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.TAG_NAME }}.zip


  auto-deploy-staging:
    needs: accept-and-release
    if: github.ref == 'refs/heads/dev'
    uses: './.github/workflows/lib_deploy.yml'
    with:
      release: ${{ needs.accept-and-release.outputs.tag_name }}
      target: ${{ vars.STAGING_DOMAIN }}
    secrets: inherit
