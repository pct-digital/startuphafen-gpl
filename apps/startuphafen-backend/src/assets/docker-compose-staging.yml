secrets:
  backend_secrets.json:
    file: '../../backend_secrets.json'

services:
  serverfluent:
    networks:
      local:
        ipv4_address: '172.42.0.33'
    container_name: startuphafen-fluentd
    restart: unless-stopped
    image: fluent/fluentd:v1.18-1
    user: root
    ports:
      - '127.0.0.1:24224:24224'
      - '127.0.0.1:24224:24224/udp'
    volumes:
      - /opt/startuphafen/logs/:/opt/startuphafen/logs/:rw
      - ./fluentd/server_fluentd.conf:/fluentd/etc/fluent.conf:ro

  caddy:
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile.staging', '--adapter', 'caddyfile']
    volumes:
      - ../../startuphafen-frontend:/srv:ro
      - /opt/${APP_NAME:-startuphafen}/caddy/data:/data
      - /opt/${APP_NAME:-startuphafen}/caddy/config:/config
    environment:
      APP_HOST: '${APP_HOST}'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    networks:
      local:
        ipv4_address: '172.42.0.8'
    logging:
      driver: 'fluentd'
      options:
        fluentd-async: 'true'
        tag: caddy
    depends_on:
      - serverfluent

  maildev:
    networks:
      local:
        ipv4_address: '172.42.0.42'
    container_name: startuphafen-maildev
    restart: unless-stopped
    image: maildev/maildev:2.2.1
    environment:
      MAILDEV_BASE_PATHNAME: '/maildev'
      MAILDEV_MAIL_DIRECTORY: /tmp/maildev
    healthcheck:
      test: 'wget -O - http://127.0.0.1:1080/maildev/healthz || exit 1'
      start_interval: 1s
      start_period: 30s
    volumes:
      # Relative to the location of the docker-compose.yml of the startuphafen-backend
      - maildev:/tmp/maildev
    logging:
      driver: 'fluentd'
      options:
        fluentd-async: 'true'
        tag: maildev
    depends_on:
      - serverfluent

  backend:
    container_name: startuphafen-backend
    restart: unless-stopped
    init: true
    image: node:22.18.0-bookworm
    user: node
    working_dir: /home/node
    # extra_hosts:
    #   Add host pins here if your OZG staging endpoints are not publicly
    #   resolvable, e.g.:
    #   - 'your-ozg-staging-host.example.invalid:203.0.113.1'
    volumes:
      - ../:/home/node/app:ro
    environment:
      NODE_OPTIONS: --max-old-space-size=4196
      NODE_ENV: production
      TZ: 'Europe/Berlin'
      HOST: '0.0.0.0'
    command: "/bin/sh -c 'node --enable-source-maps /home/node/app/main.js --config staging'"
    secrets:
      - backend_secrets.json
    networks:
      local:
        ipv4_address: '172.42.0.7'
    logging:
      driver: 'fluentd'
      options:
        fluentd-async: 'true'
        tag: backend
    depends_on:
      - serverfluent

  keycloak:
    networks:
      local:
        ipv4_address: '172.42.0.12'
    environment:
      # these are overwritten by an .env file at deployment time, which is placed on the server by the deploy pipeline
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: 'https://${APP_HOST}/kc'
      KC_HOSTNAME_ADMIN: 'https://${APP_HOST}/kc-admin'
    volumes:
      # Relative to the location of the docker-compose.yml of the startuphafen-backend
      - ./keycloak/entrypoint-staging.sh:/entrypoint-staging.sh
      - ./keycloak/themes:/opt/keycloak/themes
    entrypoint: ['/bin/bash', '/entrypoint-staging.sh']
    logging:
      driver: 'fluentd'
      options:
        fluentd-async: 'true'
        tag: keycloak
    depends_on:
      - serverfluent

networks:
  local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.42.0.0/16
          gateway: 172.42.0.1

volumes:
  maildev:
  pgdata:
    external: true
    name: pgdata
  kcpgdata:
    external: true
    name: kcpgdata
