<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
</form>

<div
  class="mt-4 p-4 rounded-lg"
  [ngClass]="{
    'bg-green-50 border border-green-400': isPercentageSumValid,
    'bg-yellow-50 border border-yellow-400':
      !isPercentageSumValid && totalPercentage < 100,
    'bg-red-50 border border-red-400': totalPercentage > 100
  }"
>
  <div class="flex items-center gap-2">
    <svg
      *ngIf="isPercentageSumValid"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      class="text-green-600"
    >
      <path d="M20 6L9 17l-5-5" />
    </svg>
    <svg
      *ngIf="!isPercentageSumValid"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      [ngClass]="{
        'text-yellow-600': totalPercentage < 100,
        'text-red-600': totalPercentage > 100
      }"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <span
      class="font-semibold"
      [ngClass]="{
        'text-green-800': isPercentageSumValid,
        'text-yellow-800': !isPercentageSumValid && totalPercentage < 100,
        'text-red-800': totalPercentage > 100
      }"
    >
      Gesamtbeteiligung: {{ totalPercentage }}%
    </span>
  </div>
  <p
    class="mt-2 text-sm"
    [ngClass]="{
      'text-green-700': isPercentageSumValid,
      'text-yellow-700': !isPercentageSumValid && totalPercentage < 100,
      'text-red-700': totalPercentage > 100
    }"
  >
    <span *ngIf="isPercentageSumValid"
      >Die Beteiligungen summieren sich korrekt auf 100%.</span
    >
    <span *ngIf="!isPercentageSumValid">
      {{ percentageErrorMessage }}
    </span>
  </p>
</div>

<div class="flex justify-center gap-4 mt-4">
  <button
    class="bg-red-500 p-2 rounded-full hover:bg-red-600 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:hover:bg-gray-400"
    (click)="removeAnteilseigner()"
    [disabled]="questionCount <= 1"
    title="Anteilseigner entfernen"
    aria-label="Anteilseigner entfernen"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
    >
      <path
        d="M5 12H19"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <button
    class="bg-primary p-2 rounded-full hover:bg-primary-shade disabled:bg-gray-400 disabled:cursor-not-allowed disabled:hover:bg-gray-400"
    (click)="addAnteilseigner()"
    [disabled]="!canAddMoreShareholders"
    [title]="
      canAddMoreShareholders
        ? 'Anteilseigner hinzufügen'
        : 'Maximale Beteiligung von 100% bereits erreicht'
    "
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
    >
      <path
        d="M12 5V19M5 12H19"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
