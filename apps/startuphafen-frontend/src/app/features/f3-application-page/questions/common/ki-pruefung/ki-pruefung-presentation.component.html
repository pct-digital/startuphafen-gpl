<form [formGroup]="form">
  <div class="space-y-5">
    <div class="ki-pruefung-field">
      <formly-form
        [form]="form"
        [fields]="fields"
        [model]="formModel"
      ></formly-form>
    </div>

    <div
      class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between"
    >
      <button
        type="button"
        data-testid="ki-pruefung-run"
        class="ki-pruefung-ai-button inline-flex items-center justify-center px-6 py-2 bg-primary text-white rounded hover:bg-primary-shade disabled:opacity-50"
        (click)="onRunHwkAi()"
        [disabled]="!canRunHwkAi"
        [class.is-loading]="hwkAiLoading"
      >
        {{ hwkAiLoading ? 'KI-Prüfung läuft...' : 'KI-Prüfung starten' }}
      </button>

      <div
        class="max-w-2xl text-left text-sm text-gray-600"
        data-testid="ki-pruefung-helper"
      >
        Die KI-Prüfung unterstützt Dich beim Ausfüllen der Fragen. Je genauer
        Deine Beschreibung, desto besser kann die KI helfen.
      </div>
    </div>

    @if (hwkAiError) {
    <div class="text-sm text-red-600">{{ hwkAiError }}</div>
    } @else if (hwkAiNotice) {
    <div
      class="text-sm text-amber-700"
      data-testid="ki-pruefung-notice"
    >
      {{ hwkAiNotice }}
    </div>
    }
  </div>
</form>
