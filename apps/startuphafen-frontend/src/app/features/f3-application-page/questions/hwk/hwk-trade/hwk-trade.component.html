<form [formGroup]="form" (ngSubmit)="onSubmit()">
  @if (showAiAutofillNotice) {
  <div
    class="mb-4 rounded border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800"
    data-testid="hwk-ai-autofill-notice"
  >
    {{ aiAutofillNotice }}
  </div>
  }
  <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  <div
    class="mt-3 space-y-1 text-sm text-gray-600"
    data-testid="hwk-trade-reference-links"
  >
    @for (referenceLink of referenceLinks; track referenceLink.href) {
    <p>
      Hier findest Du eine Auflistung
      <a
        class="text-primary underline"
        [href]="referenceLink.href"
        rel="noreferrer noopener"
        target="_blank"
      >
        {{ referenceLink.label }}
      </a>
    </p>
    }
  </div>
</form>
