<div class="container mx-auto px-4 py-8">
  <sh-profile-header-display
    [profile]="profile"
    [profileInfo]="profileInfo"
  ></sh-profile-header-display>
  <sh-profile-content-display
    [projects]="projects"
    [gewaProjects]="gewaProjects"
    [hwkApplicationProjectsStatus]="hwkApplicationProjectsStatus"
    (documentRequested)="openProjectDocument($event)"
    (hwkApplicationRequested)="openHwkApplication($event)"
    [documentEditing]="documentEditing"
    (documentsShowToggled)="toggleShowDocuments($event)"
  ></sh-profile-content-display>
</div>

<ng-template #pdfPopupTemplate>
  <div class="flex flex-col items-center p-12 md:p-20 gap-4">
    <div class="w-full lg:border-[0.5rem] lg:border-primary lg:rounded-lg">
      @if(isDocumentLoading){
      <div
        class="flex min-h-[65vh] items-center justify-center text-sm text-primary"
        data-testid="profile-document-loading"
      >
        Dokument wird geladen...
      </div>
      } @else if(documentLoadError != null){
      <div
        class="flex min-h-[65vh] items-center justify-center text-sm text-red-700"
        data-testid="profile-document-error"
      >
        {{ documentLoadError }}
      </div>
      } @else if(loadedDocument != null){
      <ngx-extended-pdf-viewer
        [height]="'65vh'"
        [src]="loadedDocument"
        [showTextEditor]="false"
        [showHighlightEditor]="false"
        [showDrawEditor]="false"
        [showStampEditor]="false"
      ></ngx-extended-pdf-viewer>
      }
    </div>
    <button
      shButton
      (click)="closeDocumentPopup()"
      class="w-full mt-8 md:w-auto items-center text-center"
    >
      OK
    </button>
  </div>
</ng-template>
