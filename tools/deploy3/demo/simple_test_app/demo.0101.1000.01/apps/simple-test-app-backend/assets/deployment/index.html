<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Number Game v2</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --card-bg: white;
        --text-main: #333;
        --text-muted: #666;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      .v2-badge {
        position: absolute;
        top: 20px;
        right: -35px;
        background: #ff4757;
        color: white;
        padding: 5px 40px;
        transform: rotate(45deg);
        font-size: 0.8em;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: var(--text-main);
        text-align: center;
        margin-bottom: 5px;
        font-size: 2.2em;
      }

      .subtitle {
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 25px;
        font-size: 0.95em;
      }

      .difficulty-selector {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        justify-content: center;
      }

      .diff-btn {
        padding: 8px 16px;
        border: 2px solid #e0e0e0;
        background: white;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85em;
        font-weight: 600;
        color: var(--text-muted);
        transition: all 0.2s;
      }

      .diff-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .game-info {
        background: #f8fafc;
        border-left: 4px solid var(--primary);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 0.95em;
        color: var(--text-main);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 14px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 1.1em;
        transition: all 0.3s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      }

      button.main-btn {
        padding: 12px 30px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      button.main-btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      button.main-btn:active {
        transform: translateY(0);
      }

      .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        font-weight: 600;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }

      .feedback.hidden {
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
      }

      .feedback.too-low {
        background: #fff1f2;
        color: #e11d48;
        border: 2px solid #fda4af;
      }

      .feedback.too-high {
        background: #fffbeb;
        color: #d97706;
        border: 2px solid #fcd34d;
      }

      .feedback.correct {
        background: #f0fdf4;
        color: #16a34a;
        border: 2px solid #86efac;
        font-size: 1.1em;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }

      .stats {
        background: #f8fafc;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        text-align: center;
      }

      .stat-label {
        color: var(--text-muted);
        font-size: 0.85em;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .stat-value {
        color: var(--text-main);
        font-size: 1.4em;
        font-weight: 800;
      }

      .reset-button {
        width: 100%;
        margin-top: 20px;
        background: #4b5563;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      .reset-button:hover {
        background: #374151;
      }

      .best-score-container {
        margin-top: 15px;
        text-align: center;
        font-size: 0.9em;
        color: var(--text-muted);
      }

      .best-score-value {
        font-weight: bold;
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="v2-badge">V2.0</div>
      <h1>🎮 Guess the Number</h1>
      <p class="subtitle">Can you find the secret number?</p>

      <div class="difficulty-selector">
        <button class="diff-btn" onclick="setDifficulty('easy')" id="btn-easy">
          Easy
        </button>
        <button
          class="diff-btn active"
          onclick="setDifficulty('medium')"
          id="btn-medium"
        >
          Medium
        </button>
        <button class="diff-btn" onclick="setDifficulty('hard')" id="btn-hard">
          Hard
        </button>
      </div>

      <div class="game-info">
        <div><strong>Range:</strong> <span id="rangeText">1 to 200</span></div>
        <div><strong>Attempts:</strong> <span id="attempts">0</span></div>
      </div>

      <div class="input-group">
        <input
          type="number"
          id="guessInput"
          placeholder="Enter your guess..."
          autocomplete="off"
        />
        <button class="main-btn" onclick="makeGuess()">Guess</button>
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Guesses</div>
          <div class="stat-value" id="guessCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Status</div>
          <div class="stat-value" id="status">🎯</div>
        </div>
      </div>

      <div class="best-score-container">
        🏆 Best Score (<span id="bestScoreLabel">Medium</span>):
        <span class="best-score-value" id="bestScore">--</span>
      </div>

      <button class="reset-button" onclick="resetGame()">🔄 New Game</button>
    </div>

    <script>
      let secretNumber = 0;
      let guessCount = 0;
      let gameWon = false;
      let currentDifficulty = 'medium';

      const difficulties = {
        easy: { max: 50, label: 'Easy' },
        medium: { max: 200, label: 'Medium' },
        hard: { max: 500, label: 'Hard' },
      };

      function initGame() {
        const max = difficulties[currentDifficulty].max;
        secretNumber = Math.floor(Math.random() * max) + 1;
        guessCount = 0;
        gameWon = false;

        document.getElementById('rangeText').textContent = `1 to ${max}`;
        document.getElementById('guessInput').value = '';
        document.getElementById('guessInput').disabled = false;
        document.getElementById('guessInput').focus();
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('status').textContent = '🎯';
        document.getElementById('guessCount').textContent = '0';
        document.getElementById('attempts').textContent = '0';

        updateBestScoreDisplay();
      }

      function setDifficulty(diff) {
        currentDifficulty = diff;

        // Update UI buttons
        document
          .querySelectorAll('.diff-btn')
          .forEach((btn) => btn.classList.remove('active'));
        document.getElementById(`btn-${diff}`).classList.add('active');

        document.getElementById('bestScoreLabel').textContent =
          difficulties[diff].label;

        initGame();
      }

      function makeGuess() {
        if (gameWon) return;

        const guessInput = document.getElementById('guessInput');
        const guess = parseInt(guessInput.value);
        const max = difficulties[currentDifficulty].max;

        if (isNaN(guess) || guess < 1 || guess > max) {
          showFeedback(`Please enter a number between 1 and ${max}`, '');
          return;
        }

        guessCount++;
        document.getElementById('guessCount').textContent = guessCount;
        document.getElementById('attempts').textContent = guessCount;

        if (guess === secretNumber) {
          gameWon = true;
          handleWin();
        } else {
          handleWrongGuess(guess);
        }

        guessInput.value = '';
        guessInput.focus();
      }

      function handleWin() {
        showFeedback(
          `🎉 Correct! You found it in ${guessCount} ${
            guessCount === 1 ? 'attempt' : 'attempts'
          }!`,
          'correct'
        );
        document.getElementById('status').textContent = '✅';
        document.getElementById('guessInput').disabled = true;

        saveBestScore();
      }

      function handleWrongGuess(guess) {
        const feedback = document.getElementById('feedback');
        feedback.classList.remove('shake');
        void feedback.offsetWidth; // Trigger reflow
        feedback.classList.add('shake');

        if (guess < secretNumber) {
          showFeedback('📈 Too low! Try a higher number.', 'too-low');
        } else {
          showFeedback('📉 Too high! Try a lower number.', 'too-high');
        }
      }

      function showFeedback(message, className) {
        const feedback = document.getElementById('feedback');
        feedback.textContent = message;
        feedback.className = 'feedback ' + className;
        feedback.classList.remove('hidden');
      }

      function saveBestScore() {
        const key = `bestScore_${currentDifficulty}`;
        const currentBest = localStorage.getItem(key);

        if (!currentBest || guessCount < parseInt(currentBest)) {
          localStorage.setItem(key, guessCount);
          updateBestScoreDisplay();
        }
      }

      function updateBestScoreDisplay() {
        const key = `bestScore_${currentDifficulty}`;
        const best = localStorage.getItem(key);
        document.getElementById('bestScore').textContent = best || '--';
      }

      function resetGame() {
        initGame();
      }

      // Allow Enter key to submit guess
      document
        .getElementById('guessInput')
        .addEventListener('keypress', function (event) {
          if (event.key === 'Enter') {
            makeGuess();
          }
        });

      // Initialize on page load
      window.addEventListener('load', initGame);
    </script>
  </body>
</html>
